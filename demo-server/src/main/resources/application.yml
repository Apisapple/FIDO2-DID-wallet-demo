spring:
  application:
    name: demo-server

  datasource:
    url: jdbc:h2:mem:fido2db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

webauthn:
  rp:
    id: localhost
    name: FIDO2 Demo Server
    origin: http://localhost:8080
