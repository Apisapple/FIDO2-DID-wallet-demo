spring:
  application:
    name: demo-server

  datasource:
    url: jdbc:h2:mem:fido2db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

webauthn:
  rp:
    id: localhost
    name: FIDO2 Demo Server
    # Accepted client origins. Add the Android client's apk-key-hash origin here once the
    # wallet's signing certificate is known; the placeholder below is not a real key hash.
    origins:
      - http://localhost:8080
      - android:apk-key-hash:pNiP5iKyQ8JwgGOaKA1zGPUPJIS-0H1xKCQcfIoGLck
