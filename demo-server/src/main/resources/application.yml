spring:
  application:
    name: demo-server

  datasource:
    url: jdbc:h2:mem:fido2db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

# The relying party identity (webauthn.rp.id / name / origins) is deliberately not set here:
# WebAuthnRpProperties rejects an absent identity at startup, so a deployment that forgets to
# configure it fails by name rather than serving ceremonies against an undefined relying party.
# For local development, activate the rp-defaults profile to get the demo identity:
#
#   ./gradlew bootRun --args='--spring.profiles.active=rp-defaults'
#
# See application-rp-defaults.yml.
