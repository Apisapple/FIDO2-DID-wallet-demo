[versions]
# 빌드 도구 및 언어
agp = "9.1.0"
kotlin = "2.3.20"
ksp = "2.3.4"

# 라이브러리 버전
cbor = "0.9"
coreKtx = "1.18.0"
appcompat = "1.7.1"
material = "1.13.0"
room = "2.8.4"
biometric = "1.2.0-alpha05"
coroutines = "1.10.2"
kotlinxSerialization = "1.10.0"

# 테스트 버전
junit5 = "5.11.0"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
mockk = "1.14.9"

[libraries]
# Android Core & UI
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }

# Database & Logic
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
cbor = { module = "co.nstant.in:cbor", version.ref = "cbor" }

# Unit Test (JUnit 5 / Jupiter)
jupiter-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockk" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

# Android Instrumented Test (Runner)
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }